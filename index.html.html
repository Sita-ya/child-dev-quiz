.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:999px;padding:3px 14px;background:var(--card);cursor:pointer;user-select:none;font-size:15px}
.chip.on{background:var(--mint)}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px;margin:2px 4px 2px 0;background:var(--sky)}
.tag.src{background:var(--yel)}.tag.warn{background:var(--coral)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:2.5px solid var(--ink);border-radius:20px;padding:8px 12px;background:var(--card);text-align:center}
.stat b{display:block;font-size:26px}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint)}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border-bottom:2px dashed var(--ink);padding:5px 6px;text-align:left}
.opt{display:block;width:100%;text-align:left;margin:9px 0;border-radius:22px;background:var(--card);box-shadow:3px 3px 0 var(--ink);padding:10px 16px}
.opt.sel{background:var(--sky)}
.opt.right{background:var(--ok)}.opt.wrong{background:var(--bad)}
.stem{font-size:19px;margin:6px 0 10px}
.grp{background:var(--soft);border:2.5px dashed var(--ink);border-radius:18px;padding:10px 14px;margin:8px 0;white-space:pre-wrap;font-size:16px}
.exp{background:var(--soft);border:2.5px solid var(--ink);border-radius:20px;padding:12px 16px;margin-top:12px;font-size:16px}
.exp p{margin:6px 0}
.exp .tip{background:var(--yel);border-radius:14px;padding:4px 12px;border:2px solid var(--ink)}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:3px 8px}
.timer{font-size:20px;font-weight:700}
.muted{opacity:.7;font-size:14px}
.nav{position:sticky;bottom:10px;display:flex;justify-content:space-between;gap:10px;margin-top:16px}
@media(max-width:560px){body{font-size:16px}h1{font-size:22px}.card{padding:14px}}
</style>
